name: Deploy Taqareer to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# منع نشر نسختين في الوقت نفسه.
concurrency:
  group: taqareer-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate required files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            "index.html"
            "manifest.json"
            "assets/styles.css"
            "assets/app.js"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required site file is missing: $file"
              exit 1
            fi
          done

          if [[ ! -d "assets" ]]; then
            echo "::error::Required directory is missing: assets"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install verification dependency
        run: npm ci

      - name: Verify application before publishing
        run: npm run check

      - name: Prepare clean Pages artifact
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf _site
          mkdir -p _site

          # ملفات التشغيل الأساسية فقط.
          cp --dereference index.html manifest.json _site/
          cp -R --dereference assets _site/

          # منع Jekyll من تغيير ملفات الموقع الثابت.
          touch _site/.nojekyll

          # منع نشر ملفات حساسة أو ملفات الخادم.
          if find _site -type f \( \
              -name ".env" -o \
              -name ".env.*" -o \
              -name "*.pem" -o \
              -name "*.key" -o \
              -name "*SUPABASE_FUNCTION*" \
            \) -print -quit | grep -q .; then
            echo "::error::Sensitive or server-only files were found in the Pages artifact."
            exit 1
          fi

          test -f _site/index.html
          test -f _site/.nojekyll

          echo "Prepared Pages artifact:"
          du -sh _site
          find _site -maxdepth 2 -type f | sort | sed -n '1,120p'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
          error_count: 20
          reporting_interval: 5000
