name: Repository Maintenance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repository-maintenance.yml'
      - 'scripts/repository-hygiene.cjs'

permissions:
  contents: write

concurrency:
  group: taqareer-repository-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove obsolete repository artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Remove known obsolete artifacts
        run: node scripts/repository-hygiene.cjs --clean

      - name: Install test dependency
        run: npm ci

      - name: Verify cleaned repository
        run: npm run check

      - name: Commit cleanup when needed
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Repository already clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove obsolete repository artifacts"
          git push origin HEAD:main
